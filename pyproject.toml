[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "permaenv"
version = "0.1.0.dev0"
description = "A portable home for your developer environment."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ogbozoyan" }]
keywords = ["cli", "developer-tools", "environment", "backup", "dotfiles"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["typer>=0.16,<1", "rich>=14,<15"]

[project.urls]
Homepage = "https://github.com/ogbozoyan/PermaEnv"
Repository = "https://github.com/ogbozoyan/PermaEnv"
Issues = "https://github.com/ogbozoyan/PermaEnv/issues"

[project.scripts]
permaenv = "permaenv.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  "mypy>=1.16,<2",
  "twine>=6,<7",
  "packaging>=25,<27",
]

[tool.hatch.build.targets.wheel]
# Keep metadata compatible with the supported Twine 6 validation toolchain.
core-metadata-version = "2.4"
packages = ["src/permaenv"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["/src", "/tests", "/scripts", "/pyproject.toml", "/README.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.coverage.run]
source = ["permaenv"]
branch = true

[tool.coverage.report]
show_missing = true
